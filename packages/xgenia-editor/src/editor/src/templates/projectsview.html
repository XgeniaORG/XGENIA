    /* CSS Variables for theming */
    :root {
      --bg-primary: #0d0d0e;
      --bg-secondary: rgba(22, 22, 24, 0.62);
      --bg-tertiary: rgba(255, 255, 255, 0.06);

    /* Base styling */
    .projects-main {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
    }

    /* Hugeicon sizing helper */
    .hgi-stroke {
      font-size: 18px;
      line-height: 1;
      vertical-align: middle;
    }

    /* Project Items */
    .projects-item {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.08);
      transform: translateY(0);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 240px;
    }

    .projects-item:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.1), 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .projects-item-thumb {
      background-color: rgba(255, 255, 255, 0.04);
      height: 160px;
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    .projects-item-cloud-download {
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      position: absolute;
      top: 0;
      left: 0;
      background: rgba(255, 255, 255, 0.04);
    }

    /* Show cloud download icon only when no background image */
    .projects-item-cloud-download.show,
    .projects-item-cloud-download[style*="display: block"] {
      display: flex !important;
    }

    /* Ensure background images are visible */
    .projects-item-thumb[style*="background-image"] {
      background-color: var(--bg-tertiary);
    }

    .projects-item-label {
      padding: 1.25rem;

      justify-content: space-between;

      font-size: 1rem;
      margin-bottom: 0.25rem;
      color: var(--text-primary);

    .projects-item-sublabel {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .projects-panel-icon-show-on-hover {
      opacity: 0;
      transition: opacity 0.3s ease;

      flex-direction: column;
      height: calc(100vh - 40px);
      position: fixed;
      top: 40px;
      left: 0;

      border: none;

      align-items: center;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;

      color: rgba(255, 255, 255, 0.85);

    .sidebar-link {

      color: rgba(255, 255, 255, 0.85);

    /* Layout */
    .local-projects-items {

      padding: 0;

    /* User Info */
    .projects-left-sidebar .sidebar-user {

      left: auto !important;
      right: auto !important;

    .user-info {

      color: var(--text-primary);

    .user-info .email {

      color: var(--text-secondary);
    }

    .user-info .plan {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
    }

    .projects-left-sidebar .sidebar-upgrade {
      position: static !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      width: 100% !important;
      padding: 10px !important;
      font-size: 14px !important;
      font-weight: 600 !important;
      border-radius: 8px !important;
      background: rgba(103, 222, 146, 0.10) !important;
      color: #67DE92 !important;
      border: none !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      margin-top: 40px !important;
      display: block !important;
      text-align: center !important;
      box-shadow: 0 0 0 0.5px rgba(103, 222, 146, 0.3) !important;
    }

    .sidebar-upgrade:hover {
      background: rgba(103, 222, 146, 0.15) !important;
    }

    /* Additional Components */
    .content-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .content-tab {
      padding: 10px 2px;
      border-radius: 0;

      color: var(--text-secondary);
      cursor: pointer;

    /* Popup and Modal Styles */

    .projects-feed-image-big {

    .projects-popup-title {

      border: none;
      width: auto;
    }

    .projects-project-name-input {

      padding: 1rem;
      font-size: 0.875rem;
      outline: none;
    }

    .projects-project-name-input::placeholder {
      color: var(--text-secondary);
    }

    .projects-exit-big-feed-item-icon {
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 50%;

      display: flex;
      align-items: center;

      transition: background 0.2s ease;
    }

    .projects-exit-big-feed-item-icon:hover {
      background: rgba(255, 255, 255, 0.12);
    }



    .projects-template-item {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .projects-template-item:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.06);
    }

    .projects-feed-image {
      height: 160px;
      background-color: rgba(255, 255, 255, 0.04);
    }

    .projects-template-item-details {
      padding: 1.25rem;
    }

    .projects-template-item-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .projects-template-item-body {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    /* Search */
    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 6px;
      padding: 10px 10px 10px 36px;
      font-size: 14px;
    }

    .search-input:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    .search-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.10);
      box-shadow: 0 0 0 1px rgba(103, 222, 146, 0.4);
    }

    .search-container {
      position: relative;
      flex: 1;
      min-width: 250px;
      max-width: 28rem;
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF;
    }

    /* Button Spinner Animation */
    .button-spinner {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .spinner-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
      animation: spinner-bounce 1.4s ease-in-out infinite both;
    }

    .spinner-dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .spinner-dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes spinner-bounce {

      0%,
      80%,
      100% {
        transform: scale(0);
        opacity: 0.5;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Loading state for button */
    .projects-create-new-project-button.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .projects-create-new-project-button.loading .button-text {
      opacity: 0.7;
    }

    .projects-create-new-project-button.loading .button-spinner {
      display: flex !important;
    }
