name: 'Send teams new build notification'
description: 'Send messages to Teams channel via webhook using Adaptive Card'

inputs:
  webhook-url:
    required: true
    description: 'Incoming webhook URL for Teams channel'
  msg-title:
    required: true
    description: 'Title of the message being sent'
  msg-text:
    required: true
    description: 'The main text of the body being sent'
  workflow-url:
    required: false
    description: 'URL link to the GitHub workflow run'
  status:
    required: false
    description: 'Status for context (optional)'

runs:
  using: 'composite'
  steps:
    - name: Build Adaptive Card payload
      id: build_payload
      shell: bash
      # Passed as environment rather than interpolated into the command line:
      # these carry commit messages and job names, and a quote in one of them
      # would otherwise break out of the shell word.
      env:
        MSG_TITLE: ${{ inputs.msg-title }}
        MSG_TEXT: ${{ inputs.msg-text }}
        WORKFLOW_URL: ${{ inputs.workflow-url }}
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        STATUS: ${{ inputs.status }}
      run: bash "${{ github.action_path }}/send_teams.sh"
