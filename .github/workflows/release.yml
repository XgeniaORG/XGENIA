name: Release (draft)

# Builds every platform with the macOS update zip included, merges the per-arch macOS update
# manifests, and opens a DRAFT GitHub release. The auto-updater ignores drafts: check the assets,
# then press Publish. Run it on main, after develop is squash-merged there: GitHub only offers a
# workflow_dispatch workflow that exists on the default branch.
#
# Run by hand it releases the stable version: packages/xgenia-editor/package.json without its
# pre-release part (3.0.3-beta.5 → v3.0.3). nightly.yml calls it with a pre-release version
# (3.0.3-beta.5): that one is published straight away, so installs on the Beta channel update to it
# without anyone pressing Publish; installs on Stable (the default) never see pre-releases.
#
# Either way, once the release exists develop's package.json moves on to the version after it
# (scripts/release/next-version.mjs): v3.0.3 → 3.0.4, v3.0.3-beta.5 → 3.0.3-beta.6.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Release this version instead of the one in packages/xgenia-editor/package.json'
        type: string
        default: ''
      nightly:
        description: 'Publish as a nightly pre-release instead of a draft'
        type: boolean
        default: false

jobs:
  # The version this run releases: the one nightly.yml passed in, or the stable version of
  # package.json for a run by hand. Every build job is stamped with it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            gh release list -R "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/released.txt"
            VERSION=$(node scripts/release/next-version.mjs stable "$(jq -r .version packages/xgenia-editor/package.json)" "$RUNNER_TEMP/released.txt")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  build:
    needs: plan
    uses: ./.github/workflows/nightly-builds.yml
    # A called workflow's jobs can't have more than this; notify-teams reads the run's job list.
    permissions:
      contents: read
      actions: read
    with:
      release: true
      version: ${{ needs.plan.outputs.version }}
    secrets: inherit

  draft-release:
    name: Draft GitHub release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read version
        id: version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse a version that already has a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already has a release (another run took it meanwhile); the next run picks the next free version."
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: XGENIA-*
          path: release-assets

      - name: Collect assets and merge the macOS update manifests
        run: node scripts/release/collect-release-assets.mjs release-assets release-dist

      # Installs refuse an update whose latest*.yml has no valid signature (update-manifest.js).
      # This job installs no npm packages, so only the repo's own dependency-free scripts see the key.
      - name: Sign the update manifests
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/release/sign-update-manifests.mjs release-dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NIGHTLY: ${{ inputs.nightly && '1' || '' }}
        run: |
          # Lowercase v: electron-updater reads the channel (beta, alpha) from the tag with semver,
          # and semver cannot parse the old "V2.1.0" style.
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          if [ -n "$NIGHTLY" ]; then
            test -n "$PRERELEASE" || { echo "::error::a nightly version must be a pre-release, got $VERSION"; exit 1; }
            TITLE="XGENIA Nightly v$VERSION"
          else
            TITLE="XGENIA v$VERSION"
          fi
          # Always a draft first: no install sees a release while its files are still uploading.
          gh release create "v$VERSION" release-dist/* \
            --draft $PRERELEASE \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes

      # Read back what GitHub actually holds, the way an install will use it: every manifest signed
      # with the key the app trusts, every listed file uploaded at the size the manifest says.
      - name: Verify the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release/verify-release.mjs "v$VERSION" --draft

      # Nightly: no human step, so it is published here, then checked once more from the public URLs
      # an install downloads from. If that fails it goes back to a draft, so no install takes it.
      - name: Publish the nightly
        if: inputs.nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit "v$VERSION" --draft=false
          for i in 1 2 3 4 5; do
            node scripts/release/verify-release.mjs "v$VERSION" --public && exit 0
            echo "Public check failed (try $i), retrying in 30s"
            sleep 30
          done
          echo "::error::v$VERSION failed the public check; turning it back into a draft"
          gh release edit "v$VERSION" --draft=true
          exit 1

  # The release exists (published for a nightly, a draft for a run by hand), so its version is taken:
  # develop's package.json moves on to the next one, 3.0.3-beta.5 → 3.0.3-beta.6 or 3.0.3 → 3.0.4.
  # Pushed over the bot's deploy key, which develop's ruleset lets through (the GITHUB_TOKEN cannot
  # push to develop). [skip ci]: the bump is not itself a change worth a nightly. Never lowers a
  # version someone raised by hand meanwhile. This job installs nothing, so the key is never next to
  # third-party code.
  bump-version:
    name: Move develop's version on
    needs: [plan, draft-release]
    runs-on: ubuntu-latest
    steps:
      # Without the key, actions/checkout quietly falls back to the GITHUB_TOKEN over https, which
      # develop's ruleset always rejects. Not set up yet: skip with a warning; releases still work,
      # since the next nightly skips versions already taken, only package.json lags behind.
      - name: Deploy key set up?
        id: key
        env:
          HAS_DEPLOY_KEY: ${{ secrets.BOT_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_DEPLOY_KEY" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BOT_DEPLOY_KEY is not set, so develop's version was not moved on (update-plan.md → Setup checklist 1-3)."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          ref: develop
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}

      - name: Commit the next version to develop
        if: steps.key.outputs.ok == 'true'
        env:
          RELEASED: ${{ needs.plan.outputs.version }}
        run: |
          # Only the deploy key gets past develop's ruleset; a push over https is the GITHUB_TOKEN's.
          git remote get-url --push origin | grep -q '^git@github.com:' || { echo "::error::origin is not the deploy key's ssh remote"; exit 1; }
          NEXT=$(node scripts/release/next-version.mjs bump "$RELEASED")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch --quiet origin develop
            git reset --quiet --hard origin/develop
            NOW=$(node scripts/release/next-version.mjs set packages/xgenia-editor/package.json "$NEXT")
            if git diff --quiet; then
              echo "develop is already at $NOW (at or past $NEXT)."
              exit 0
            fi
            git commit --quiet -am "Bump editor version to $NOW after v$RELEASED [skip ci]"
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            test "$CHANGED" = "packages/xgenia-editor/package.json" || { echo "::error::the bump would change more than package.json: $CHANGED"; exit 1; }
            git push origin HEAD:develop && { echo "develop: $NOW"; exit 0; }
            echo "Push rejected (try $i); retrying on the newest develop"
            sleep 5
          done
          echo "::error::develop rejected the version bump. Its ruleset needs \"Deploy keys\" in the bypass list (update-plan.md → Setup checklist 3)."
          exit 1
