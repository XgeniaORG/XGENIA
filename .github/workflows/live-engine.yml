name: Live Engine

on:
  push:
    branches: [develop]
    paths:
      - 'packages/xgenia-runtime/**'
      - 'packages/xgenia-viewer-react/**'
      - 'scripts/live-engine/**'
      - 'package-lock.json'
      - '.github/workflows/live-engine.yml'
  repository_dispatch:
    types: [private-main-push]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [build, promote]
        default: build
      version:
        type: string
        required: false
        description: 'promote: version to make stable (empty = current beta)'

concurrency:
  group: live-engine
  cancel-in-progress: false

jobs:
  # Builds and tests the engine. Holds no signing or upload key: npm install runs third-party code.
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'build'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      private_sha: ${{ steps.version.outputs.private_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Private main (required — no engine without the slot nodes)
        env:
          PRIVATE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
        run: |
          test -n "$PRIVATE_PAT" || { echo "PRIVATE_SUBMODULE_PAT is missing"; exit 1; }
          git config --global url."https://x-access-token:${PRIVATE_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --remote private
          git config --global --unset-all url."https://x-access-token:${PRIVATE_PAT}@github.com/".insteadOf
          test -f private/xgenia-pro-nodes/src/index.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Engine tests
        run: |
          npm test -w @xgenia/runtime -- --ci
          node --test 'packages/xgenia-editor/tests/live-engine/*.test.cjs'
          node --test scripts/live-engine/pack.test.mjs scripts/live-engine/workflow.test.mjs scripts/live-engine/minify-viewer.test.mjs
          npx tsx packages/xgenia-runtime/src/api/test-compiler-bundle-parity.ts

      - name: Version
        id: version
        run: |
          v="$(date -u +%Y%m%d.%H%M)-$(git rev-parse --short=8 HEAD)-$(git -C private rev-parse --short=8 HEAD)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "private_sha=$(git -C private rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "XGENIA_ENGINE_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build engine files
        run: |
          OUTPUT_PATH="$RUNNER_TEMP/engine/files" npm run build -w @xgenia/xgenia-viewer-react
          node scripts/live-engine/build-compiler.mjs "$RUNNER_TEMP/engine/files/compiler/xgenia.rgs-compiler.js" "$XGENIA_ENGINE_VERSION"

      # A game's node Script is a full copy of the engine it was saved from. The runtime tells a stale
      # copy from a real edit by hashes of every engine version (packages/xgenia-runtime/scripts/
      # generate-engine-history.cjs), so the record must hold THIS build's text: build, record, build
      # again with the record inside. The member text does not depend on the record, so one pass is enough.
      - name: Engine history (stale node-Script copies)
        run: |
          node packages/xgenia-runtime/scripts/generate-engine-history.cjs --repo private --bundles "$RUNNER_TEMP/engine/files/viewer/xgenia.viewer.js"
          OUTPUT_PATH="$RUNNER_TEMP/engine/files" npm run build -w @xgenia/xgenia-viewer-react

      # Off until a game has been played on a minified build (same switch as the release build).
      - name: Minify the viewer (repo variable XGENIA_MINIFY_VIEWER=1)
        if: vars.XGENIA_MINIFY_VIEWER == '1'
        run: node scripts/live-engine/minify-viewer.mjs "$RUNNER_TEMP/engine/files/viewer/xgenia.viewer.js"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-files
          path: ${{ runner.temp }}/engine/files
          retention-days: 7

  # Signs and publishes. No npm here: only the repo's own dependency-free scripts touch the keys.
  # Protect the `live-engine` environment (Settings → Environments): deployment branch develop only.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: live-engine
    env:
      XGENIA_ENGINE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: engine-files
          path: ${{ runner.temp }}/engine/files

      - name: Pack and sign
        env:
          ENGINE_SIGNING_KEY: ${{ secrets.ENGINE_SIGNING_KEY }}
          ENGINE_OUTER_SHA: ${{ github.sha }}
          ENGINE_PRIVATE_SHA: ${{ needs.build.outputs.private_sha }}
        run: node scripts/live-engine/pack.mjs --files "$RUNNER_TEMP/engine/files" --out "$RUNNER_TEMP/engine/upload" --channel beta

      - name: Smoke
        run: node scripts/live-engine/smoke.mjs "$RUNNER_TEMP/engine/upload" beta

      - name: Publish to beta
        env:
          SUPABASE_ENGINE_SERVICE_KEY: ${{ secrets.SUPABASE_ENGINE_SERVICE_KEY }}
        run: node scripts/live-engine/publish.mjs "$RUNNER_TEMP/engine/upload" "$XGENIA_ENGINE_VERSION" beta

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
    runs-on: ubuntu-latest
    environment: live-engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote to stable
        env:
          ENGINE_SIGNING_KEY: ${{ secrets.ENGINE_SIGNING_KEY }}
          SUPABASE_ENGINE_SERVICE_KEY: ${{ secrets.SUPABASE_ENGINE_SERVICE_KEY }}
          PROMOTE_VERSION: ${{ inputs.version }}
        run: node scripts/live-engine/promote.mjs "$PROMOTE_VERSION"
