name: GitHub Alert Workflow

on:
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      # Pass context to env vars to prevent script injection and safely handle quotes/newlines
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      COMMIT_URL: ${{ github.event.compare }}
      ACTOR: ${{ github.actor }}
      REF_NAME: ${{ github.ref_name }}
      WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: Send Webhook Alert
        run: |
          # Check if the commit message contains a PR number format (e.g., #123)
          if [[ "$COMMIT_MSG" != *"#"* ]]; then
            # Direct Push Alert
            # printf safely processes \n\n into real newlines and injects variables into the %s slots
            printf -v TEXT "⚠️ **WARNING** ⚠️\n\n[@%s](https://github.com/%s) just pushed directly to the %s branch!\n\n⬆️ **Commit Details** ⬆️\n\nTitle: %s\n\nURL: %s" "$ACTOR" "$ACTOR" "$REF_NAME" "$COMMIT_MSG" "$COMMIT_URL"
          else
            # Merged PR Alert - Extract PR number from the commit message
            PR_NUM=$(echo "$COMMIT_MSG" | grep -oP '#\d+' | head -1)
            printf -v TEXT "ℹ️ **INFO** ℹ️\n\n[@%s](https://github.com/%s) merged pull request %s to the %s branch.\n\n⬆️ **Commit Details** ⬆️\n\nTitle: %s\n\nURL: %s" "$ACTOR" "$ACTOR" "$PR_NUM" "$REF_NAME" "$COMMIT_MSG" "$COMMIT_URL"
          fi

          # Safely construct the JSON payload using jq
          PAYLOAD=$(jq -n \
            --arg text "$TEXT" \
            '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": null,
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": $text,
                        "wrap": true
                      }
                    ]
                  }
                }
              ]
            }')

          # Send the webhook
          curl -X POST -H 'Content-type: application/json' \
          --data "$PAYLOAD" \
          "$WEBHOOK_URL"
