name: Private pointer

# Keeps the private/ pointer on the latest private main, without a person and without a GitHub App:
#   1. decide: is private main ahead of the pointer, and is a bump due (throttle)?
#   2. checks: the PR checks (pr-checks.yml, called as a reusable workflow) against the branch with
#      private/ at the new commit;
#   3. push:   only if they pass, a commit that changes nothing but the private gitlink, pushed straight
#      to the branch over a deploy key.
# That push starts nightly.yml: pushes made over a deploy key start workflows, pushes made with the
# built-in GITHUB_TOKEN do not. On develop, a ruleset lists deploy keys as a bypass actor, so this
# push needs no PR or approval; the checks in step 2 are the gate.
#
# Triggers:
#   - private-main-push, sent by the private repo on every push to main
#     (XFORGE_Private/.github/workflows/notify-live-engine.yml);
#   - an hourly schedule, which picks up whatever the throttle held back and covers a lost dispatch;
#   - manual runs, which skip the throttle.
# repository_dispatch and schedule only ever run the copy of this file on the default branch (main).
#
# Pushes to private are uneven: one a day, or twenty. The throttle pushes at most one bump per
# PRIVATE_POINTER_MIN_HOURS (repo variable, default 4), so a quiet day ships its one commit within the
# hour and a busy day becomes a few nightlies, not twenty. Runs queue rather than cancel each other
# (one running, the newest waiting), so a bump always gets to finish.
#
# Setup (repo admin, no org settings needed):
#   - a deploy key with write access (Settings → Deploy keys); its private half is the secret
#     BOT_DEPLOY_KEY;
#   - develop protected by a ruleset (Settings → Rules) with "Deploy keys" in its bypass list;
#   - secrets.PRIVATE_SUBMODULE_PAT, already used by the build workflows, to read private main.
on:
  repository_dispatch:
    types: [private-main-push]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: private-pointer
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The branch whose pointer the bot keeps current and whose pushes become nightlies.
  BASE: develop
  PRIVATE_REPO: XgeniaORG/XFORGE_Private

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.decide.outputs.bump }}
      base: ${{ steps.decide.outputs.base }}
      latest: ${{ steps.decide.outputs.latest }}
      pinned: ${{ steps.decide.outputs.pinned }}
      count: ${{ steps.decide.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          MIN_HOURS: ${{ vars.PRIVATE_POINTER_MIN_HOURS || '4' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          HAS_DEPLOY_KEY: ${{ secrets.BOT_DEPLOY_KEY != '' }}
        run: |
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # Not set up yet (see Setup above): skip quietly rather than fail and alert the team hourly.
          if [ "$HAS_DEPLOY_KEY" != "true" ]; then
            echo "::notice::BOT_DEPLOY_KEY is not set; the private pointer bot is off."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$PRIVATE_PAT" || { echo "::error::PRIVATE_SUBMODULE_PAT is missing"; exit 1; }
          LATEST=$(git ls-remote "https://x-access-token:${PRIVATE_PAT}@github.com/${PRIVATE_REPO}.git" refs/heads/main | cut -f1)
          PINNED=$(git ls-tree HEAD private | awk '{print $3}')
          test -n "$LATEST" || { echo "::error::could not read ${PRIVATE_REPO} main"; exit 1; }
          echo "$BASE pins ${PINNED:0:8}, private main is ${LATEST:0:8}"
          if [ "$LATEST" = "$PINNED" ]; then
            echo "Up to date."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # When the bot last bumped this branch: its commits all start with the same message.
          LAST_BUMP=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$BASE&per_page=100" \
            --jq '[.[] | select(.commit.message | startswith("Move private pointer to"))][0].commit.committer.date // empty')
          if [ -z "$MANUAL" ] && [ -n "$LAST_BUMP" ]; then
            AGE=$(( $(date -u +%s) - $(date -u -d "$LAST_BUMP" +%s) ))
            if [ "$AGE" -lt $(( MIN_HOURS * 3600 )) ]; then
              echo "Last bump ${AGE}s ago (< ${MIN_HOURS}h); the hourly run picks this up later."
              echo "bump=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Count only: private commit messages never go into this public repo.
          COUNT=$(GH_TOKEN="$PRIVATE_PAT" gh api "repos/${PRIVATE_REPO}/compare/${PINNED}...${LATEST}" --jq .total_commits 2>/dev/null || echo "?")
          {
            echo "bump=true"
            echo "latest=$LATEST"
            echo "pinned=$PINNED"
            echo "count=$COUNT"
          } >> "$GITHUB_OUTPUT"

  # The same checks a PR into the branch gets, with private/ at the commit about to be pinned.
  checks:
    needs: decide
    if: needs.decide.outputs.bump == 'true'
    uses: ./.github/workflows/pr-checks.yml
    with:
      ref: ${{ needs.decide.outputs.base }}
      private-sha: ${{ needs.decide.outputs.latest }}
    secrets: inherit

  push:
    needs: [decide, checks]
    runs-on: ubuntu-latest
    steps:
      # Over the deploy key: that is what lets this push start nightly.yml, and get past develop's
      # ruleset. This job installs nothing, so the key is never next to third-party code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.base }}
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}

      - name: Push the pointer bump
        env:
          LATEST: ${{ needs.decide.outputs.latest }}
          PINNED: ${{ needs.decide.outputs.pinned }}
          COUNT: ${{ needs.decide.outputs.count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The branch may have moved while the checks ran: put the bump on its newest commit, and
          # try again if someone pushes in between. Only the gitlink changes; private/ is never
          # checked out here.
          for i in 1 2 3; do
            git fetch --quiet origin "$BASE"
            git reset --quiet --hard "origin/$BASE"
            if [ "$(git ls-tree HEAD private | awk '{print $3}')" = "$LATEST" ]; then
              echo "$BASE already points at ${LATEST:0:8}."
              exit 0
            fi
            git update-index --cacheinfo "160000,${LATEST},private"
            git commit --quiet -m "Move private pointer to ${LATEST:0:8}" \
              -m "From ${PINNED:0:8}, ${COUNT} commits on private main. Pushed by the private pointer bot after the PR checks passed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            test "$CHANGED" = "private" || { echo "::error::the bump would change more than private/: $CHANGED"; exit 1; }
            git push origin "HEAD:$BASE" && exit 0
            echo "Push rejected (try $i); retrying on the newest $BASE"
            sleep 5
          done
          echo "::error::could not push the bump to $BASE"
          exit 1

  notify-failure:
    needs: [decide, checks, push]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/teams-notification
        with:
          webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          msg-title: 'Private pointer bump failed'
          msg-text: |
            ${{ env.BASE }} still points private/ at ${{ needs.decide.outputs.pinned || 'the previous commit' }}.
            Failed at: ${{ needs.checks.result == 'failure' && 'the checks' || needs.push.result == 'failure' && 'the push' || 'deciding' }}
            The next push to private main, or the hourly run, tries again.
          status: failure
          workflow-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
