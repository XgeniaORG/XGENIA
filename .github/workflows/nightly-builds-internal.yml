name: Nightly Multi-Platform Build

on:
  # push:
  # branches: ['develop']
  # pull_request:
  #   branches: ['']
  # schedule:
  #   - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual triggering
  workflow_call:

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      # max-parallel: 1
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Init private submodule (optional)
        continue-on-error: true
        run: |
          if [ -n "$PRIVATE_PAT" ]; then
            git config --global url."https://x-access-token:${PRIVATE_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init private
          else
            echo "Private submodule PAT not available, building with stubs"
          fi
        env:
          PRIVATE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Import Code-Signing Certificate
        env:
          CSC_CONTENT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$CSC_CONTENT" | base64 --decode > "$CERT_PATH"

          # Fresh keychain, no auto-lock, so codesign/notarytool never hit a
          # relocked keychain mid-build (the cause of the SecKeychainUnlock error).
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Put the new keychain ahead of the existing search list rather than
          # replacing it, so electron-builder's CSC_IDENTITY_AUTO_DISCOVERY can
          # still find the identity.
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[",]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build macOS ${{ matrix.arch }}
        env:
          TARGET_PLATFORM: 'darwin-${{ matrix.arch }}'
          DISABLE_SIGNING: false
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run build:editor -- --skip-git

      - name: Packing DMG file
        run: npm run build:editor:pack

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XGENIA-macOS-${{ matrix.arch }}
          path: publish
          retention-days: 7

      - name: Remove code-signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Init private submodule (optional)
        continue-on-error: true
        run: |
          if [ -n "$PRIVATE_PAT" ]; then
            git config --global url."https://x-access-token:${PRIVATE_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init private
          else
            echo "Private submodule PAT not available, building with stubs"
          fi
        env:
          PRIVATE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
          libarchive-tools \
          libfuse2 \
          fakeroot \
          dpkg \
          rpm

      - name: Build Linux App (AppImage, deb)
        env:
          TARGET_PLATFORM: 'linux-x64'
          DISABLE_SIGNING: true
        run: npm run build:editor -- --skip-git

      - name: Packing AppImage and Deb File
        run: npm run build:editor:pack

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XGENIA-Linux-x64
          path: publish
          retention-days: 7

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Init private submodule (optional)
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$PRIVATE_PAT" ]; then
            git config --global url."https://x-access-token:${PRIVATE_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init private
          else
            echo "Private submodule PAT not available, building with stubs"
          fi
        env:
          PRIVATE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build MCP package
        run: npx lerna exec --scope @xgenia/mcp -- npm run build

      - name: Build Windows App (NSIS)
        env:
          TARGET_PLATFORM: 'win32-x64'
          DISABLE_SIGNING: true
        run: npm run build:editor -- --skip-git

      - name: Packing NSIS Installer
        run: npm run build:editor:pack

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XGENIA-Windows-x64
          path: publish
          retention-days: 7
